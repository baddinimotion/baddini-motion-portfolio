<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — BADDINI</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; padding: clamp(1rem, 5vw, 6rem); display: grid; align-items: center; background: #f4f0e8; color: #0d0d0d; font: 1rem/1.5 system-ui, sans-serif; }
    main { border: 2px solid; box-shadow: .45rem .45rem 0; padding: clamp(1rem, 5vw, 5rem); }
    .label { font: bold .85rem monospace; }
    h1 { margin: .16em 0; font: 900 clamp(3.3rem, 10vw, 10rem)/.91 Impact, sans-serif; text-transform: uppercase; }
    span { color: #e52e2e; }
    a { color: inherit; text-underline-offset: .2em; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p class="label">BADDINI MOTION / ERRO 404</p>
    <h1>Página não<br>encontrada<span>.</span></h1>
    <a id="back-home" href="./index.html">← Voltar para a home</a>
  </main>
  <script>
    const parts = location.pathname.split('/').filter(Boolean);
    const projectIndex = parts.indexOf('baddini-motion-portfolio');
    if (projectIndex >= 0) {
      const nestedLevels = parts.length - projectIndex - (location.pathname.endsWith('/') ? 1 : 2);
      document.getElementById('back-home').href = '../'.repeat(Math.max(0, nestedLevels)) + './index.html';
    }
  </script>
</body>
</html>
