<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — BADDINI</title>
  <meta name="description" content="Página não encontrada.">
  <meta property="og:image" content="images/brand/Baddini_Avatar_1080x1080.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@800;900&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/brand/Baddini_Avatar_1080x1080.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      text-align: center;
    }
    .not-found {
      max-width: 960px;
      padding: 3rem 1.5rem;
      margin: auto;
    }
    .not-found .mast {
      width: min(260px, 42vw);
      margin: 0 auto 2rem;
    }
    .not-found h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      margin-bottom: 1rem;
    }
    .not-found p {
      font-size: clamp(1rem, 2vw, 1.5rem);
      margin-bottom: 1.5rem;
    }
    .not-found .button {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html" aria-label="Voltar para a página inicial">
      <img src="images/brand/logo-preto.png" alt="BADDINI" height="40">
    </a>
  </header>
  <main class="not-found">
    <img class="mast" src="images/brand/Baddini_Avatar_1080x1080.png" alt="BADDINI, o macaco The Weirdo">
    <h1 class="display">404 — Not found</h1>
    <p>A página que você procura não existe ou foi movida.</p>
    <a class="button" href="index.html">Voltar ao portfólio</a>
  </main>
</body>
</html>
