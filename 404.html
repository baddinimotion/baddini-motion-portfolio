<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — BADDINI</title>
  <meta name="description" content="Página não encontrada.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--paper);
      text-align: center;
    }
    .not-found {
      max-width: 960px;
      padding: 3rem 1.5rem;
    }
    .not-found .mast {
      width: min(260px, 42vw);
      margin: 0 auto 2rem;
    }
    .not-found h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      margin-bottom: 1rem;
    }
    .not-found p {
      font-size: clamp(1rem, 2vw, 1.5rem);
      margin-bottom: 1.5rem;
    }
    .not-found a {
      display: inline-block;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <img class="mast" src="images/the-weirdo.svg" alt="Mascote da Baddini">
    <h1 class="display">404 — Not found</h1>
    <p>A página que você procura não existe ou foi movida.</p>
    <a class="btn" href="index.html">Voltar ao portfólio</a>
  </main>
</body>
</html>
