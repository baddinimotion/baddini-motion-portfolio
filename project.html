<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projeto — BADDINI</title>
  <meta name="description" content="Detalhes do projeto de BADDINI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@800;900&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/brand/Baddini_Avatar_1080x1080.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a href="index.html" class="brand" aria-label="Voltar para a página inicial">
      <img src="images/brand/logo-preto.png" alt="BADDINI" height="40">
    </a>
    <nav aria-label="Navegação do projeto">
      <a href="index.html#work">← Todos os trabalhos</a>
    </nav>
  </header>

  <main id="case"></main>

  <footer class="case-footer">
    <span>© <span id="y"></span></span>
    <span>Rio de Janeiro, Brasil</span>
    <img class="footer-mascot" src="images/brand/Baddini_Avatar_1080x1080.png" alt="">
  </footer>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    const caseRoot = document.getElementById('case');
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    function renderModule(module) {
      if (!module || !module.type) return '';

      if (module.type === 'text') {
        return `
          <section class="project-copy">
            <h2 class="display">${module.heading || ''}</h2>
            <p>${module.credit || ''}</p>
          </section>
        `;
      }

      if (module.type === 'gallery') {
        const items = Array.isArray(module.items) ? module.items : [];
        const content = items.map((item) => item.type === 'image'
          ? `<img src="${item.src}" alt="${item.alt || ''}" data-orientation="${item.orientation || ''}">`
          : `<video src="${item.src}" aria-label="${item.alt || 'Animação do projeto'}" data-orientation="${item.orientation || ''}" autoplay muted loop playsinline preload="metadata"></video>`).join('');
        const columns = items.length === 4 ? 3 : items.length === 3 ? 2 : items.length || module.columns || 2;
        const fallbackClass = items.length === 3 || items.length === 4
          ? ' gallery--mixed'
          : ` columns-${columns}`;
        return `<div class="project-gallery${fallbackClass}" data-item-count="${items.length}" style="--gallery-columns:${columns}">${content}</div>`;
      }

      if (module.type === 'video') {
        return `
          <figure class="project-video">
            <video src="${module.src}"${module.poster ? ` poster="${module.poster}"` : ''} controls playsinline preload="metadata"></video>
            ${module.title ? `<figcaption>${module.title}</figcaption>` : ''}
          </figure>
        `;
      }

      if (module.type === 'embed') {
        return `<iframe class="embed" src="${module.src}" title="${module.title || 'Vídeo do projeto'}" allow="autoplay; fullscreen; picture-in-picture" loading="eager"></iframe>`;
      }

      if (module.type === 'link') {
        return `<p class="project-social-link"><a href="${module.src}" target="_blank" rel="noopener">${module.label || 'Abrir publicação'} ↗</a></p>`;
      }

      return `<img class="project-still" src="${module.src}" alt="${module.alt || ''}" loading="lazy">`;
    }

    fetch('projects.json')
      .then((response) => response.json())
      .then((list) => {
        const project = Array.isArray(list) ? list.find((item) => item && item.id === id) : null;

        if (!project) {
          caseRoot.innerHTML = `
            <div class="case-head">
              <h1 class="display">Projeto não encontrado</h1>
              <p><a class="btn" href="index.html#work">Voltar para o portfólio</a></p>
            </div>
          `;
          return;
        }

        const nextProject = list[(list.findIndex((item) => item && item.id === id) + 1) % list.length] || null;
        const title = project.title || 'Projeto sem título';
        document.title = `${title} — BADDINI`;

        const modules = Array.isArray(project.modules) ? project.modules : [];
        const behanceLink = project.behance || 'https://www.behance.net/brunobaddini';

        caseRoot.innerHTML = `
          <div class="case-head">
            <h1 class="display">${title}</h1>
            <div class="meta">
              <span><b>Categoria</b> ${project.category || ''}</span>
              <span><b>Ano</b> ${project.year || ''}</span>
              <span><b>Cliente</b> ${project.client || ''}</span>
              <span><b>Ferramentas</b> ${project.tools || ''}</span>
            </div>
            <p>${project.description || ''}</p>
          </div>

          <div class="modules">
            ${modules.map(renderModule).join('') || '<p class="empty-state">Este projeto ainda não tem módulos publicados.</p>'}
          </div>

          <div class="case-foot">
            <a class="btn ghost" href="${behanceLink}" target="_blank" rel="noopener">Ver no Behance</a>
            ${nextProject ? `<a class="btn" href="project.html?id=${encodeURIComponent(nextProject.id)}">Próximo: ${nextProject.title || 'Projeto'}</a>` : ''}
          </div>
        `;

        caseRoot.querySelectorAll('.project-gallery[data-item-count="3"], .project-gallery[data-item-count="4"]').forEach((gallery) => {
          const classify = () => {
            const orientations = [...gallery.children].map((media) => {
              if (['landscape', 'portrait', 'square'].includes(media.dataset.orientation)) {
                return media.dataset.orientation;
              }

              const width = media.tagName === 'IMG' ? media.naturalWidth : media.videoWidth;
              const height = media.tagName === 'IMG' ? media.naturalHeight : media.videoHeight;
              if (!width || !height) return '';

              const ratio = width / height;
              if (ratio > 1.05) return 'landscape';
              if (ratio < 0.95) return 'portrait';
              return 'square';
            });

            if (orientations.some((orientation) => !orientation)) return;

            gallery.classList.remove('gallery--3-landscape', 'gallery--4-landscape', 'gallery--3-portrait', 'gallery--mixed');
            const count = orientations.length;
            const allLandscape = orientations.every((orientation) => orientation === 'landscape');
            const allPortrait = orientations.every((orientation) => orientation === 'portrait');

            if (count === 3 && allPortrait) {
              gallery.classList.add('gallery--3-portrait');
            } else if (count === 3 && allLandscape) {
              gallery.classList.add('gallery--3-landscape');
            } else if (count === 4 && allLandscape) {
              gallery.classList.add('gallery--4-landscape');
            } else {
              gallery.classList.add('gallery--mixed');
              gallery.style.setProperty('--gallery-columns', count === 4 ? '3' : '2');
            }
          };

          gallery.querySelectorAll('img, video').forEach((media) => {
            media.addEventListener(media.tagName === 'IMG' ? 'load' : 'loadedmetadata', classify);
            media.addEventListener('error', classify);
          });
          classify();
        });
      })
      .catch(() => {
        caseRoot.innerHTML = '<div class="case-head"><p>Erro ao carregar o projeto. Verifique o arquivo projects.json.</p></div>';
      });
  </script>
</body>
</html>
